# Groups the auto-generated release notes by pull request label.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: ✨ New features
      labels: [enhancement]
    - title: 🐞 Bug fixes
      labels: [bug]
    - title: 🔒 Security
      labels: [security]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
