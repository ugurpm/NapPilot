<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#3B5BDB"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="500" cy="628" r="128" fill="#fff"/>
      <circle cx="560" cy="580" r="112" fill="#000"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shine)"/>
  <!-- Power symbol: open ring and bar. -->
  <path d="M 665.9 345 A 255 255 0 1 1 358.1 345" fill="none" stroke="#FFFFFF" stroke-width="86" stroke-linecap="round"/>
  <line x1="512" y1="214" x2="512" y2="420" stroke="#FFFFFF" stroke-width="86" stroke-linecap="round"/>
  <!-- Sleep: crescent moon inside the ring. -->
  <rect x="300" y="420" width="420" height="380" fill="url(#moon)" mask="url(#crescent)"/>
</svg>
